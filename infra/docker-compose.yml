# Docker Compose file for Big Data Infrastructure

services:
  # ---------------------------
  # Common Infrastructure
  # ---------------------------
  # Zookeeper removed for KRaft mode

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Replace CLUSTER_ID with a unique base64 UUID using "kafka-storage random-uuid" format
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  # ---------------------------
  # Spark (Batch Layer) - Kept as requested
  # ---------------------------
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-with-numpy:3.5.0
    container_name: spark-master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ..:/app
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-with-numpy:3.5.0
    depends_on:
      - spark-master
    ports:
      - "8083-8085:8081"
    volumes:
      - ..:/app
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2

  # ---------------------------
  # Flink (Speed Layer)
  # ---------------------------
  flink-jobmanager:
    build:
      context: ..
      dockerfile: infra/Dockerfile.flink
    container_name: flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    volumes:
      - ..:/app
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    build:
      context: ..
      dockerfile: infra/Dockerfile.flink
    depends_on:
      - flink-jobmanager
    command: taskmanager
    volumes:
      - ..:/app
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  # ---------------------------
  # Application Services
  # ---------------------------
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      - kafka
      - redis
    environment:
      APP_CONFIG: "config/config.docker.yaml"
    volumes:
      - ..:/app
    ports:
      - "28000:8000"
    command: bash -lc "uvicorn src.datascience.service:app --host 0.0.0.0 --port 8000 --reload"

  flink-job:
    build:
      context: ..
      dockerfile: infra/Dockerfile.flink
    depends_on:
      - kafka
      - redis
      - flink-jobmanager
    environment:
      APP_CONFIG: "config/config.docker.yaml"
      FLINK_CONF_DIR: "/opt/flink/conf"
    volumes:
      - ..:/app
    # Submit job and exit
    command: flink run -m flink-jobmanager:8081 -py /app/src/datascience/components/speed.py -d
    restart: no

  generator:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      - kafka
    environment:
      APP_CONFIG: "config/config.docker.yaml"
    volumes:
      - ..:/app
    command: python src/datascience/components/ingestion.py
    restart: unless-stopped

volumes:
  kafka_data:
